#
# Проверки flang-env на каждый толчок.
#
# Компилятор flang — один двоичный файл, которому нужен только `cc`, поэтому он
# собирается прямо здесь из своего же клона: ни Node, ни Python в этом
# конвейере нет ни в одном шаге.
name: Проверки

"on":
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux — проверка, примеры, печать, прогон плана
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          check-latest: false

      - name: Компилятор flang
        run: |
          git clone --depth 1 https://github.com/digitable-lol/flang.git /tmp/flang-src
          make -C /tmp/flang-src/bootstrap -j4
          echo "/tmp/flang-src/bootstrap" >> "$GITHUB_PATH"

      - name: Разбор, типы, завершаемость, примеры
        run: make проверка

      - name: Ведомость доказательств — печатается, а не подразумевается
        run: flang check --proof flang/env.flang | tail -8

      # У плана ведомости НЕТ, и двоичный отвечает кодом 2, а не нулём: законов
      # плана он не считает и молчать об этом отказывается. Это часть договора,
      # и здесь она проверяется, а не обходится.
      - name: У плана ведомость не печатается — и это сказано, а не умолчано
        run: |
          set +e
          out=$(flang check --proof flang/read-env.flang 2>&1); code=$?
          set -e
          echo "$out" | tail -3
          test "$code" = "2" || { echo "ждали код 2, получили $code" >&2; exit 1; }
          echo "$out" | grep -q "ведомость не печатается" || { echo "нет объяснения отказа" >&2; exit 1; }

      - name: Печать в Go и в C, сборка обеих
        run: make печать

      - name: План читает окружение сам, через flang io
        run: make план

      - name: Цель печати «план» отказывает — и это часть договора
        run: |
          for t in go c rust; do
            if flang emit flang/read-env.flang --target "$t" --out "$RUNNER_TEMP/plan-$t" 2>&1 | grep -q FLANG_PLAN_UNSUPPORTED; then
              echo "цель $t: отказ на месте"
            else
              echo "цель $t: отказа НЕТ — README врёт" >&2
              exit 1
            fi
          done

      - name: Лицензионный сторож
        run: make лицензии

      - name: Дерево чистое
        run: |
          make чисто
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "Проверки наследили в дереве." >&2
            exit 1
          fi
