#
# Проверки flang-env на каждый толчок.
#
# Компилятор flang — один двоичный файл, которому нужен только `cc`, поэтому он
# собирается прямо здесь из своего же клона: ни Node, ни Python в этом
# конвейере нет ни в одном шаге. Go ставится ТОЛЬКО ради напечатанного кода
# (`gofmt`, `go vet`, `go build` над `out-go/`) — рукописного Go в дереве нет
# ни строкой, и отдельный шаг это проверяет.
#
# КАЖДЫЙ ШАГ — ЯРЛЫК, а не своя строка. Два шага — «у плана ведомости нет» и
# «цель печати отказывает» — жили ТОЛЬКО здесь, и повторить их у себя было
# нечем: теперь это ярлыки `отказ` и `граница`.
#
# НИ ОДНОГО КОНВЕЙЕРА ЧЕРЕЗ `|` НАД ПРОВЕРЯЮЩЕЙ КОМАНДОЙ. Оболочка шагов —
# `bash -e` без `pipefail`, поэтому `flang check --proof … | tail -8` отдавал
# код `tail`, то есть всегда ноль.
name: Проверки

"on":
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux — проверка, ведомость, печать, граница слоёв, прогон плана
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          check-latest: false

      - name: Компилятор flang
        run: |
          git clone --depth 1 https://github.com/digitable-lol/flang.git /tmp/flang-src
          make -C /tmp/flang-src/bootstrap -j4
          echo "/tmp/flang-src/bootstrap" >> "$GITHUB_PATH"

      - name: Список ярлыков читается двоичным
        run: ./ярлык

      - name: Разбор, типы, завершаемость, примеры
        run: ./ярлык проверка

      - name: Ведомость доказательств слоя 1
        run: ./ярлык ведомость

      - name: У плана ведомость не печатается — и это сказано, а не умолчано
        run: ./ярлык отказ

      - name: Печать слоя 1 в Go и в C, сборка обеих
        run: ./ярлык печать

      - name: Граница слоёв — цели печати отказывают, и это часть договора
        run: ./ярлык граница

      - name: План читает окружение сам, через flang io
        run: ./ярлык план

      - name: Лицензионный сторож
        run: ./ярлык лицензии

      # Сторож читает файлы по списку `git ls-files`, а нечитаемое пропускает
      # молча — этим пропуском из-под него уже выпадали кириллические имена.
      - name: Сторож посмотрел на каждый файл, а не пропустил молча
        run: |
          ./ярлык лицензии > "$RUNNER_TEMP/guard.json"
          listed=$(git ls-files | wc -l)
          read_n=$(grep -o '"Прочитать файл"' "$RUNNER_TEMP/guard.json" | wc -l)
          echo "в дереве $listed, прочитано $read_n"
          test "$listed" = "$read_n" || { echo "сторож пропустил файлы" >&2; exit 1; }

      - name: В дереве нет Go, питона и JavaScript
        run: |
          bad=$(git ls-files | grep -E '\.(go|py|pyi|js|mjs|cjs|ts|tsx|jsx)$' || true)
          if [ -n "$bad" ]; then echo "$bad"; echo "файл на чужом языке" >&2; exit 1; fi
          echo "чужого языка в дереве нет"

      - name: Ярлыка с опечаткой нет — оболочка отвечает кодом 2
        run: |
          set +e
          ./ярлык такого-ярлыка-нет >/dev/null 2>&1
          code=$?
          set -e
          test "$code" = "2" || { echo "ждали код 2, получили $code" >&2; exit 1; }
          echo "неизвестный ярлык отвергается кодом 2"

      - name: Дерево чистое
        run: |
          ./ярлык чисто
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "Проверки наследили в дереве." >&2
            exit 1
          fi
